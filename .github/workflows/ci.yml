name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check Nix shells
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run checks
        run: nix-shell --run "make check"

      - name: Verify formatting
        run: |
          nix-shell --run "make fmt"

          if ! git diff --exit-code; then
            echo "::error::Formatting changes are required. Run 'make fmt' locally."
            exit 1
          fi

      - name: Validate development shells
        run: |
          for shell in */shell.nix; do
            echo "Checking $shell..."
            nix-instantiate --eval "$shell" >/dev/null
          done
